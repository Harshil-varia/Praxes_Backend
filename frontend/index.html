<!DOCTYPE html>
<html>
<head>
  <title>Telemed Messages</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Telemedicine Consultation Messages</h1>
  <!-- create new consultation?-->
  <div>
  <h3>Create New Consultation</h3>
  <input type="text" id="new-patient-id" placeholder="Patient ID (e.g. P999)">
  <input type="text" id="new-doctor-id" placeholder="Doctor ID (e.g. D888)">
  <button onclick="createConsult()">Create</button>
</div>

  <!-- consultation selector -->
  <div>
    <label>Select Consultation:</label>
    <select id="consult-select">
      <option value="">-- Pick one --</option>
    </select>
    <button id="load-btn">Load</button>
    <button id="copy-id-btn" style="display:none">Copy ID</button>
  </div>

  <!-- show the current consultation ID -->
  <div id="current-id-section" style="display:none">
    <p><strong>Current Consultation ID:</strong></p>
    <code id="current-id" style="background: #f0f0f0; padding: 5px; display: block; word-break: break-all;"></code>
  </div>

  <!-- filter buttons -->
  <div>
    <button class="filter-btn active" data-role="" onclick="filterMsgs('')">All</button>
    <button class="filter-btn" data-role="patient" onclick="filterMsgs('patient')">Patient</button>
    <button class="filter-btn" data-role="doctor" onclick="filterMsgs('doctor')">Doctor</button>
  </div>

  <!-- messages display -->
  <div id="messages">
    <p>Select a consultation above</p>
  </div>

  <!-- send message form (hidden until consultation selected) -->
  <div id="sender-section" style="display:none">
    <h3>Send Message</h3>
    <p>Patient: <span id="patient-id"></span> | Doctor: <span id="doctor-id"></span></p>
    <button onclick="pickSender('patient')">Send as Patient</button>
    <button onclick="pickSender('doctor')">Send as Doctor</button>
    <p id="selected-user"></p>
  </div>

  <div>
    <input type="hidden" id="sender-id">
    <input type="hidden" id="sender-role">
    <textarea id="msg-text" rows="3" placeholder="Type message..."></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
